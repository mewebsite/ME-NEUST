name: Unpublish Legacy GitHub Pages Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  unpublish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare empty artifact to decommission legacy GitHub Pages URL
        run: |
          mkdir -p /tmp/decommissioned-pages
          touch /tmp/decommissioned-pages/.nojekyll
          cat << 'EOF' > /tmp/decommissioned-pages/sw.js
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', event => {
            event.waitUntil(
              caches.keys()
                .then(keys => Promise.all(keys.map(k => caches.delete(k))))
                .then(() => self.registration.unregister())
            );
          });
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload empty artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/decommissioned-pages'
      - name: Deploy empty artifact to clear GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
