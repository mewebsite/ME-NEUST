<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ME BoardPrep - Mechanical Engineering Question Bank & Licensure Exam Simulator</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Styles -->
  <link rel="stylesheet" href="styles.css?v=2.2.5">
  
  <!-- React Production Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Bundled Question Bank & Quizzes Data (3,105 Questions) -->
  <script src="questions-data.js?v=2.2.5"></script>

  <!-- Real-Time WebSocket Synchronization Client -->
  <script src="paho-mqtt.min.js?v=2.2.5"></script>

  <!-- Real-Time Cloud Firestore Sync Engine -->
  <script src="static-engine.js?v=2.2.5"></script>
</head>
<body>
  <div id="root"></div>
  <!-- High-Speed Pre-Compiled Application Bundle -->
  <script src="app.bundle.js?v=2.2.5"></script>
  
  <!-- Offline Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[Service Worker] Active & Registered:', reg.scope))
          .catch(err => console.warn('[Service Worker] Registration error:', err));
      });
    }
  </script>
</body>
</html>
